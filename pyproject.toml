[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantreplay"
version = "0.1.0"
description = "An educational backtesting engine for simple trading strategies."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ivan Venkov", email = "ivan.venkov.developer@gmail.com" },
]
keywords = ["backtesting", "finance", "trading", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.1",
    "typing-extensions>=4.12",
    "yfinance>=0.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
quantreplay = "backtester.cli:main"

[project.urls]
Homepage = "https://github.com/IvanVenkov712/QuantReplay"
Repository = "https://github.com/IvanVenkov712/QuantReplay.git"
Issues = "https://github.com/IvanVenkov712/QuantReplay/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
